services:
    postgres:
        image: postgres:18
        container_name: postgres
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata_finances:/var/lib/postgresql/18/data

    backend:
        build: .
        container_name: fastapi_finances
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        ports:
            - "8000:8000"
        volumes:
            - ./:/app

volumes:
    pgdata_finances:
