version: '3.8'

services:
    postgres:
        image: postgres:18
        container_name: postgres
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pgdata_finances:/var/lib/postgresql/18/data
volumes:
    pgdata_finances:
